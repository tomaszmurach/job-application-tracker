apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: job-tracker

spec:
  replicas: 2

  selector:
    matchLabels:
      app: api

  template:
    metadata:
      labels:
        app: api

    spec:
      containers:
        - name: api
          image: ghcr.io/tomaszmurach/job-application-tracker:515825c56d381c09e6f4462ddcf01e8bd43ca98c
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000
              name: http

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: job-tracker-db
                  key: DATABASE_URL

          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: job-tracker

spec:
  selector:
    app: api

  ports:
    - name: http
      port: 80
      targetPort: 8000
