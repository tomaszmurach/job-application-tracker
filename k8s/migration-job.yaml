apiVersion: batch/v1
kind: Job
metadata:
  name: database-migration
  namespace: job-tracker

spec:
  backoffLimit: 3

  template:
    metadata:
      labels:
        app: database-migration

    spec:
      restartPolicy: Never

      containers:
        - name: migration
          image: ghcr.io/tomaszmurach/job-application-tracker:515825c56d381c09e6f4462ddcf01e8bd43ca98c
          imagePullPolicy: IfNotPresent

          command:
            - alembic

          args:
            - upgrade
            - head

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: job-tracker-db
                  key: DATABASE_URL
